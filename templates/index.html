{% extends 'base.html' %}
{% block title %}台股價格查詢{% endblock %}
{% block content %}
<h1 class="mb-4">輸入股票代碼</h1>
<div class="input-group mb-3">
  <input type="text" class="form-control" id="stock-code-input" placeholder="例如：2330 或 2330.TW" aria-label="股票代碼">
  <button class="btn btn-primary ms-2" id="search-btn">查詢</button>
</div>
<div class="mb-3">
  <label for="refresh-interval" class="form-label">刷新頻率</label>
  <select class="form-select" id="refresh-interval">
    <option value="0">手動</option>
    <option value="10">10秒</option>
    <option value="60">1分鐘</option>
    <option value="300">5分鐘</option>
  </select>
</div>
<div id="stock-info" class="mt-4"></div>
{% endblock %}
